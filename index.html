<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recruiter Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 25px 40px;
        }

        header h1 {
            margin: 0 0 8px;
        }

        header p {
            margin: 0;
            color: #cbd5e1;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .card h3 {
            color: #64748b;
            margin-top: 0;
        }

        .number {
            font-size: 32px;
            font-weight: bold;
        }

        .search-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        input {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-top: 10px;
        }

        .table-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f8fafc;
        }

        .email {
            color: #2563eb;
        }

        @media (max-width: 700px) {
            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Recruiter Finder Dashboard</h1>
    <p>Search and manage recruiter contacts</p>
</header>

<div class="container">

    <div class="stats">

        <div class="card">
            <h3>Total Recruiters</h3>
            <div class="number" id="total">0</div>
        </div>

        <div class="card">
            <h3>Emails Found</h3>
            <div class="number" id="emails">0</div>
        </div>

        <div class="card">
            <h3>Companies</h3>
            <div class="number" id="companies">0</div>
        </div>

    </div>


    <div class="search-box">

        <h2>Search Recruiters</h2>

        <input
            type="text"
            id="search"
            placeholder="Search recruiter, company, email or role..."
        >

    </div>


    <div class="table-box">

        <h2>Recruiter List</h2>

        <table>

            <thead>
                <tr>
                    <th>Recruiter Name</th>
                    <th>Company</th>
                    <th>Email</th>
                    <th>Role</th>
                </tr>
            </thead>

            <tbody id="recruiterTable">
            </tbody>

        </table>

    </div>

</div>


<script>

let recruiters = [];


fetch("recruiters.csv")
.then(response => response.text())
.then(csv => {

    const rows = csv.trim().split("\n");

    rows.shift();

    recruiters = rows.map(row => {

        const data = row.split(",");

        return {
            name: data[0],
            company: data[1],
            email: data[2],
            role: data[3]
        };

    });

    showRecruiters(recruiters);

});


function showRecruiters(data) {

    const table = document.getElementById("recruiterTable");

    table.innerHTML = "";

    data.forEach(recruiter => {

        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${recruiter.name}</td>
            <td>${recruiter.company}</td>
            <td class="email">${recruiter.email}</td>
            <td>${recruiter.role}</td>
        `;

        table.appendChild(row);

    });


    document.getElementById("total").innerText = data.length;

    document.getElementById("emails").innerText =
        data.filter(r => r.email).length;

    const companyNames =
        new Set(data.map(r => r.company));

    document.getElementById("companies").innerText =
        companyNames.size;

}


document.getElementById("search")
.addEventListener("input", function() {

    const searchText = this.value.toLowerCase();

    const filtered = recruiters.filter(r =>

        r.name.toLowerCase().includes(searchText) ||

        r.company.toLowerCase().includes(searchText) ||

        r.email.toLowerCase().includes(searchText) ||

        r.role.toLowerCase().includes(searchText)

    );

    showRecruiters(filtered);

});

</script>

</body>
</html>
